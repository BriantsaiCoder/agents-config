# gitleaks 設定：三主機共用設定倉（agents-config）
# 繼承 gitleaks 預設規則集，另將 skills/ 內第三方 vendored 文件排除於掃描外。
#
# 為何排除 skills/：此目錄為 skill 安裝器帶入的第三方文件（大宗是 ecpay/ 公開 sandbox
# 測試向量、各 skill 文件內的範例 API key）。gitleaks 最易誤報的 generic-api-key 規則在此
# 命中 224 次，經核對全為公開範例值。已另以真實憑證格式（AIza / gh_ / sk- / eyJ / 去除
# EXAMPLE 的 AKIA）獨立掃描全庫（含 skills/）= 0，故排除不遮蔽任何真實外洩。
#
# ponytail: 天花板——全域排除 skills/ 代表未來若有人把「真實」secret 塞進 skill 文件不會
# 觸發。可接受的理由：真實憑證只存在於 ~/.codex、從不落入 ~/.agents/skills/，且 skills/ 為
# vendored 內容非本倉自寫。升級路徑：若日後 skills/ 改為容納自寫敏感內容，改為 rule-scoped
# allowlist（僅豁免 generic-api-key、保留高信心規則續掃 skills/）。
title = "agents-config gitleaks"

[extend]
useDefault = true

[allowlist]
description = "vendored 第三方 skill 文件（ECPay 公開 sandbox 測試向量 + AWS AKIAIOSFODNN7EXAMPLE 範例）"
paths = ['''skills/.*''']

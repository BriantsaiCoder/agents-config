name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 七條 lint，其中 rule 1 比對 core/routing.md 逐名點名的 skill 是否存在於
      # skills/——那是 2026-07 九個死名事故的結構性根絕。
      # --check 為 dry-run：跑 lint + 印組裝位元組，不寫任何檔。
      - name: agents-sync lint（7 rules；含 routing 死名偵測）
        run: AGENTS_HOME="$GITHUB_WORKSPACE" bash bin/agents-sync --check

      # [T0-3] force-push guard 回歸。2026-07-25 實測過五個破口
      # （--all / --mirror / 多 refspec / -fu 捆綁 / 完整路徑），全部在此覆蓋。
      - name: guard 雙格式回歸（68 cases）
        run: GUARD="$GITHUB_WORKSPACE/hooks/guard-git-push.sh" bash tests/git-push-guard.sh

      # guard 是承載安全判定的 shell；-S error 只抓確定性 bug 不抓風格
      - name: shellcheck（hooks / tests / bin）
        run: shellcheck -S error hooks/*.sh tests/*.sh bin/agents-sync

      # 2026-07-25 踩過：新增 skill 未跑 agents-sync，dist/skill-index.md 停在 52
      # 而 skills/ 已 53，該 skill 對三家 host 都不可見。這條把它變成機械攔截。
      - name: skill-index 與 skills/ 一致
        run: |
          ls -1 skills > "$RUNNER_TEMP/dirs.txt"
          grep -v '^<!-- agents-skill-index' dist/skill-index.md > "$RUNNER_TEMP/idx.txt"
          if ! diff -u "$RUNNER_TEMP/dirs.txt" "$RUNNER_TEMP/idx.txt"; then
            echo "::error::dist/skill-index.md 與 skills/ 不一致——請跑 bin/agents-sync 重生後提交"
            exit 1
          fi

      # 部署產物須與 source 同步。只比 body：banner 內嵌 HEAD sha，每個 commit
      # 都會變，整檔比對會永遠紅（第一版就是這樣寫錯的）。
      - name: dist/ 產物與 source 同步（僅比 body，忽略 banner sha）
        run: |
          AGENTS_HOME="$GITHUB_WORKSPACE" AGENTS_DEPLOY_ROOT="$RUNNER_TEMP/deploy" \
            bash bin/agents-sync > /dev/null
          rc=0
          for f in dist/AGENTS.md dist/copilot-instructions.md; do
            sed '1d' "$f" > "$RUNNER_TEMP/new.txt"
            git show "HEAD:$f" | sed '1d' > "$RUNNER_TEMP/old.txt"
            if ! diff -u "$RUNNER_TEMP/old.txt" "$RUNNER_TEMP/new.txt"; then
              echo "::error file=$f::產物與 source 不同步——請跑 bin/agents-sync 後提交"
              rc=1
            fi
          done
          exit $rc

  # conformance.sh 不納入 CI：它斷言的是 ~/.claude、~/.codex 的實際部署結果
  # （settings.json 的 $defaults、audit log 權限、部署後 AGENTS.md、codex
  # execpolicy 等），runner 上不存在這些。它仍是本機動 guard / hook / settings
  # / core 後的必跑項——見 tests/conformance.sh 標頭。

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 —— version-tripwire 的 --selftest 要對基準線 commit
      # (8d701ca) 斷言每條絆線都真的會觸發，淺 clone 抓不到那個 commit。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 驗證 shared skills source、Claude link scratch bootstrap／doctor、
      # retired deployment interfaces fail-loud、shell syntax 與 collision guard。
      # CI runner 沒有 live ~/.agents；該 host-local check 會明確標為 SKIP。
      - name: shared-skills conformance
        run: AGENTS_HOME="$GITHUB_WORKSPACE" bash tests/conformance.sh

      # [T0-3] force-push guard 回歸。2026-07-25 實測過五個破口
      # （--all / --mirror / 多 refspec / -fu 捆綁 / 完整路徑），全部在此覆蓋。
      - name: guard 雙格式回歸（68 cases）
        run: GUARD="$GITHUB_WORKSPACE/hooks/guard-git-push.sh" bash tests/git-push-guard.sh

      # lib-vendored.sh 是「可否原地編輯第三方 skill」的唯一機械判準。2026-07-25 它漏判
      # 6 個 vendored skill 中的 2 個，其中一個的漏判直接導致一次未察覺的 in-place edit。
      # false negative 才是危險方向：假 VND 只成本一次人工確認，假 "-" 授權改別人的 skill。
      - name: vendored 偵測回歸（33 cases）
        run: AGENTS_HOME="$GITHUB_WORKSPACE" bash tests/vendored-detection.sh

      - name: Matt workflow carrier contracts
        run: bash tests/mattpocock-workflow.sh

      - name: Stage B2 skill checkpoint
        run: bash tests/matt-thin-workflow.sh

      - name: Claude routing collision guard selftest
        run: bash tests/claude-routing-collision.sh --selftest

      - name: Legacy mp collision guard
        run: |
          bash tests/legacy-mp-collision.sh

      - name: agents-branch portable isolation
        run: bash tests/agents-branch.sh

      - name: PR review gate 回歸（10 cases）
        run: bash tests/pr-review-gate.sh

      # parity 本身只能在本機比（runner 沒有 ~/.claude / ~/.codex），但 parity 檢查器的
      # 邏輯可以在 CI 驗——含「exec bit 存在」這條：呼叫端用 [ -x ] 判斷，非 executable
      # 等於防線靜默失效（2026-07-30 實測過的缺陷）。
      - name: guard parity 檢查器回歸（11 cases）
        run: bash tests/hook-parity.sh

      # guard 是承載安全判定的 shell；-S error 只抓確定性 bug 不抓風格。
      # skills/auditing-skill-folder/scripts/*.sh 不在此列——上面那條測試是它的守護。
      - name: shellcheck（hooks / tests / bin）
        run: shellcheck -S error hooks/*.sh tests/*.sh bin/agents-sync bin/pr-review-gate bin/hook-parity-check

      # 2026-07-26 版本時效稽核（約 4.6M subagent token）修掉 30 個 skill 的死寫法：
      # 教已移除的 API、不存在的 image tag、已 EOL 的 runtime。這 28 條把那批缺陷的
      # 複發成本降到零。只掃 skills/——proposals/ 的稽核報告與 attic/ 的歸檔副本必然
      # 含有這些字串，實測 repo-wide 掃會誤觸 19 條。
      - name: 版本絆線（28 條死寫法，僅 skills/）
        run: bash tests/version-tripwire.sh

      # 絆線自身的腐化守衛：對基準線 commit 斷言每條都仍會觸發。
      # 一條在基準線也 0 命中的絆線代表 pattern 已寫壞，它會安靜地永遠通過——
      # 那比沒有絆線更糟，因為它製造被保護的錯覺。（實測踩過一次：把 regex
      # 誤用 grep -F，[;,] 被當字面值而永遠 0 命中。）
      - name: 版本絆線自我驗證（28 條須全部仍會觸發）
        run: bash tests/version-tripwire.sh --selftest

      # install-hooks.sh 自身可用性。CI **無法**斷言「hooks 已安裝」——那是每台開發機
      # 的屬性，runner 是全新 checkout 必然沒裝。但可以斷言**安裝器本身沒壞**：跑它，
      # 然後驗結果與版控來源逐位元組相同。
      # 這條會抓到的實際 bug（2026-07-25）：install-hooks.sh 曾用
      # `git rev-parse --show-toplevel` 解析路徑，那解析的是 **cwd** 的 repo，從別的
      # 目錄以絕對路徑呼叫會去操作錯的 repo。從 repo 外呼叫的情形一併覆蓋。
      - name: install-hooks.sh 可用且產物與來源一致
        run: |
          bash hooks/install-hooks.sh
          hp="$(git rev-parse --git-path hooks)"
          case "$hp" in /*) d="$hp" ;; *) d="$GITHUB_WORKSPACE/$hp" ;; esac
          rc=0
          for p in pre-commit-agents.sh:pre-commit post-checkout-agents.sh:post-checkout; do
            src="hooks/${p%%:*}"; dst="$d/${p##*:}"
            [ -x "$dst" ] || { echo "::error::${p##*:} 未安裝或不可執行"; rc=1; continue; }
            cmp -s "$src" "$dst" || { echo "::error file=$src::${p##*:} 安裝結果與來源不同"; rc=1; }
          done
          # 從 repo 外以絕對路徑呼叫也必須作用在本 repo（cwd bug 回歸）
          ( cd "$RUNNER_TEMP" && bash "$GITHUB_WORKSPACE/hooks/install-hooks.sh" >/dev/null ) \
            || { echo "::error::從 repo 外呼叫 install-hooks.sh 失敗"; rc=1; }
          cmp -s hooks/post-checkout-agents.sh "$d/post-checkout" \
            || { echo "::error::從 repo 外呼叫後產物不一致（cwd 解析 bug 回歸）"; rc=1; }
          exit $rc

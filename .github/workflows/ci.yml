name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # locale baseline 釘死為 C.UTF-8。2026-08-02 稽核
    # （proposals/2026-08-02-shell-hook-audit/）發現這裡原本沒有立場：runner 預設值
    # 變動會改變一整類缺陷會不會在 CI 發作，而沒有東西會在它改變時提醒。
    #
    # 三個候選各自的實測行為（bash 3.2.57，2026-08-02）：
    #
    #                  多位元組語意          排序 collation
    #   C              無（缺陷不重現）      A B a b（確定性）
    #   C.UTF-8        有（缺陷會重現）      A B a b（確定性）
    #   en_US.UTF-8    有（缺陷會重現）      a A b B（locale-specific）
    #
    # 「多位元組語意」指的是 `$var` 緊接非 ASCII 時 bash 會不會把後續 byte 吃進
    # 變數名——那正是 PR #26 那個 hook fail-open 的成因。釘 C 會讓 CI 對整類缺陷
    # 失明，釘 en_US.UTF-8 則把 locale-specific 排序帶進來，兩者都有代價。
    # C.UTF-8 同時拿到確定性排序與 UTF-8 語意，是唯一沒有取捨的選項。
    #
    # 本 baseline 不影響既有慣例：repo 內十餘處 per-command `LC_ALL=C` 前綴
    # （sort 的確定性、wc -w 與 tr 的位元組級處理）會覆蓋 job-level 設定。
    # tests/word-budget.sh 更明確測三種 locale 下結果一致，不依賴本設定。
    #
    # 實測三種 baseline 下 bin/ci-local 都是
    # TOTAL=23  RAN=19  PASS=19  FAIL=0  SKIPPED=4
    # 所以這個選擇不改變當前任何測試的結果——依據是哪個立場站得住，不是哪個能過。
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8

    steps:
      # step 名稱不寫 case 數，這條規則由 tests/conformance.sh 機械守護（規則 9 下沉）。
      # 曾經九個 step 把條數寫進名稱，實測漂移過兩次且都靜默通過：版本絆線停在 28 而
      # 實際 45（9b645c5 更正），guard parity 停在 11 而實際 13。沒有任何東西會在條數
      # 變動時提醒你改名稱，所以它只會愈來愈不準。條數由各腳本收尾行自報（「N PASS /
      # 0 FAIL」等），CI log 直接可見，bin/ci-local 也會印出該行。
      #
      # fetch-depth: 0 —— version-tripwire 的 --selftest 要對基準線 commit
      # (8d701ca) 斷言每條絆線都真的會觸發，淺 clone 抓不到那個 commit。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: install ripgrep test dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: install gitleaks test dependency
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin gitleaks

      # 驗證 shared skills source、Claude link scratch bootstrap／doctor、
      # retired deployment interfaces fail-loud、shell syntax 與 collision guard。
      # CI runner 沒有 live ~/.agents；該 host-local check 會明確標為 SKIP。
      - name: shared-skills conformance
        run: AGENTS_HOME="$GITHUB_WORKSPACE" bash tests/conformance.sh

      # [T0-3] force-push guard 回歸。2026-07-25 實測過五個破口
      # （--all / --mirror / 多 refspec / -fu 捆綁 / 完整路徑），全部在此覆蓋。
      - name: guard 雙格式回歸
        run: GUARD="$GITHUB_WORKSPACE/hooks/guard-git-push.sh" bash tests/git-push-guard.sh

      # [INT-10] 以 Git 已解析的 remote ref 判定；另驗四 repo 安裝與 rollback（2026-08-04）。
      - name: INT-10 Git pre-push safety rail
        run: bash tests/pre-push-global-config.sh

      # lib-vendored.sh 是「可否原地編輯第三方 skill」的唯一機械判準。2026-07-25 它漏判
      # 6 個 vendored skill 中的 2 個，其中一個的漏判直接導致一次未察覺的 in-place edit。
      # false negative 才是危險方向：假 VND 只成本一次人工確認，假 "-" 授權改別人的 skill。
      - name: vendored 偵測回歸
        run: AGENTS_HOME="$GITHUB_WORKSPACE" bash tests/vendored-detection.sh

      - name: ui-ux-pro-max core 回歸
        run: |
          python3 -B skills/ui-ux-pro-max/scripts/validate_data.py
          python3 -B -m unittest discover -s skills/ui-ux-pro-max/scripts/tests -v

      # Step 2 description linter 的雙語分類。2026-08-01 之前它只認英文，任何 zh-TW
      # description 只能落到 "?"（UNASSESSED），永遠不可能得 YES。危險方向是只補 GOOD 側：
      # 那會把「必須人工讀」變成「靜默通過」。這組測試把 TRAP-first 的落地方向釘死，
      # 並保留一個 fixture 證明 zh-TW 的 "?" 桶仍然可達。
      - name: description linter 雙語回歸
        run: AGENTS_HOME="$GITHUB_WORKSPACE" bash tests/description-lint.sh

      # Step 2c 觸發評測的計分邏輯。這是唯一會花真實 rate-limit 額度的稽核步驟，所以它的
      # 判斷必須能在不花錢的前提下被釘死——本測試以 mock runner 驅動真正的 eval-triggers.sh，
      # 零 API 呼叫。危險方向是「基礎設施失敗被讀成 skill 沒觸發」：auth 過期或額度耗盡若
      # 被計為 quiet 的 PASS，一次斷網就會產出一份全綠的假稽核報告。該語意與 SKIP
      # （disable-model-invocation，只有 Claude 認）、collision 必須指名贏家、mock 結果
      # 必帶警語，四條都在此把關。
      - name: Step 2c 觸發評測計分回歸（零 API）
        run: AGENTS_HOME="$GITHUB_WORKSPACE" bash tests/trigger-eval.sh

      # Step 1 的字數預算。`wc -w` 按空白切詞，中文沒有詞間空白，因此一段 40 字的 zh-TW
      # 段落只算 1 個 word——那不是誤差而是整道閘對一整類 skill 失效。修法是加 CJK 字元計數
      # 而非換算法：無 CJK 的檔 effective 恆等於 wc -w，英文行為完全不變。另含防復發守衛：
      # 任何宣告的 tier 若在真實語料上 0 命中即 FAIL（舊的 150/200 兩層匹配 0/95 個 skill）。
      - name: 字數預算回歸（含 CJK 與死 tier）
        run: AGENTS_HOME="$GITHUB_WORKSPACE" bash tests/word-budget.sh

      # bin/ci-local 是「在本機跑 CI 跑的東西」的單一入口，步驟清單由本檔解析而來。一個永遠
      # 回綠的 CI 包裝器比沒有更糟——它讓「本機驗過了」變成噪音，而那正是它要消滅的問題。
      # 這組 selftest 用假 workflow 釘死失敗語意，其中最重要的是「本機缺 CI 會安裝的工具算
      # FAIL 不算 SKIP」：缺工具的失敗方向是假綠（反向斷言整段不跑仍回 PASS）。
      - name: ci-local 失敗語意 selftest
        run: bash bin/ci-local --selftest

      - name: Matt workflow carrier contracts
        run: bash tests/mattpocock-workflow.sh

      - name: Stage B2 skill checkpoint
        run: bash tests/matt-thin-workflow.sh

      - name: Claude routing collision guard selftest
        run: bash tests/claude-routing-collision.sh --selftest

      - name: Legacy mp collision guard
        run: |
          bash tests/legacy-mp-collision.sh

      - name: agents-branch portable isolation
        run: bash tests/agents-branch.sh

      - name: PR review gate 回歸
        run: bash tests/pr-review-gate.sh

      # parity 本身只能在本機比（runner 沒有 ~/.claude / ~/.codex），但 parity 檢查器的
      # 邏輯可以在 CI 驗——含「exec bit 存在」這條：呼叫端用 [ -x ] 判斷，非 executable
      # 等於防線靜默失效（2026-07-30 實測過的缺陷）。
      - name: guard parity 檢查器回歸
        run: bash tests/hook-parity.sh

      # delegation 政策的三家一致性。2026-08-02 之前三家寫法不對稱到看不出來：kernel 有
      # [INT-4]，~/.claude/CLAUDE.md 寫 blanket 禁令，~/.codex/AGENTS.md 只提工具名，
      # ~/.copilot/copilot-instructions.md 一條都沒有。症狀是「同一任務三家跑出不同行為」，
      # 幾乎不可能歸因回設定。runner 沒有那三個 host 入口檔，直接讀真實路徑會讓 host 半邊整段
      # SKIP——那正好是本測試唯一存在理由所在的那一半。因此 CI 走 --fixtures：注入合格與
      # 不合格的假 host 檔，正向組必須 exit 0 且無 host SKIP，反向組必須 exit 非 0。做法與
      # tests/hook-parity.sh 的 PARITY_COPIES 同型——用 fixture 讓判定邏輯在 runner 上跑完。
      # --selftest 先驗兩個方向的斷言真的會觸發——沒有它，偵測可以整段不執行而仍回綠。
      - name: delegation 政策三家一致性
        run: |
          bash tests/delegation-policy-parity.sh --selftest
          AGENTS_HOME="$GITHUB_WORKSPACE" bash tests/delegation-policy-parity.sh --fixtures

      # tier0 有三份實體：~/.claude/core/tier0-safety.md（Claude 靠 @import 常駐）與
      # ~/.codex/AGENTS.md、~/.copilot/copilot-instructions.md（兩者無 import 機制，只能內嵌）。
      # 三份都蓋同一個 FP:AGENTS-T0-2026Q3 指紋宣稱同版，但 agents-sync 不碰入口檔；
      # 2026-08-04 實測 Claude/Copilot 的 T0-1/5/7 仍是 blanket gate，三家 T0-9 又與 shared
      # bot UNAVAILABLE fallback 衝突。runner 沒有真實 host 檔，故 CI 跑 --selftest：以完整
      # clause 與正反 fixture 驗 autonomy exception、risk trigger、review outcome、五要素、
      # 整條規則與指紋都會 fail closed，並避免把含空白 clause 拆成鬆散 token 的舊誤報。
      - name: tier0 規範內容三家等價
        run: bash tests/tier0-parity.sh --selftest

      # Host adapter 可用不同 prose 與機制；以 canonical capability→semantic-anchor mapping
      # 驗等價，避免整檔 hash／逐字同步把三家綁成同一份設定。selftest 含三家正向與單家
      # 漂移反向 fixture，並要求各 host 個別回報 PASS／FAIL／UNAVAILABLE。
      - name: 三家 semantic capability 等價
        run: bash tests/three-host-capability-parity.sh --selftest

      # [INT-10] 全域設定變更走 PR 路徑。整條路徑的每一步本來就有規範（[INT-6] branch、
      # [T1-8] Ready PR、review-triage.md 的 bot gate、[T0-9] merge、ledgers.md:86 刪
      # branch），缺的是入口守門員：沒有條文規定什麼變更必須走上去。[T0-9] 的觸發是
      # 「merge 前」，而直接 push main 沒有 merge 動作，於是該 gate 連同它唯一的獨立
      # 視角（bot review）可以被整條繞過且不違反任何條文——2026-08-03 有四個全域設定
      # commit 就是這樣落地的：CI 全綠，bot review 從未產生。
      # kernel 在本 repo 內，故 CI 除 selftest 外可直接驗真實條文。其中一條斷言專門擋
      # 「把尚未實作的機械攔截講成已強制」——過度承諾比沒有規則更危險。
      - name: INT-10 PR 路徑規則守衛
        run: |
          bash tests/pr-path-gate.sh --selftest
          AGENTS_HOME="$GITHUB_WORKSPACE" bash tests/pr-path-gate.sh

      # 上面三支各驗一半，中間有縫：git-push-guard 驗判定邏輯但只對一份檔案，
      # hook-parity 驗漂移偵測機制但用 fixture，hook-parity-check 驗三份內容一致——
      # 內容一致不等於「deny 路徑走得到」。PR #26 就是這個縫的形狀：protect-files.sh
      # 的 hook_block 因變數展開在它執行前就 abort，deny 路徑其實走不到，而所有既有
      # 測試都是綠的。這兩支補的是行為層：餵它 deny 輸入，斷言真的被擋。
      #
      # runner 沒有 ~/.claude / ~/.codex，host 副本那部分會標 SKIP（非合規缺陷，
      # 見 bin/hook-parity-check 檔頭 L16）；repo 正本必跑。
      - name: guard deny 路徑可達性
        run: AGENTS_HOME="$GITHUB_WORKSPACE" bash tests/guard-push-reachability.sh

      - name: protect-files deny 路徑可達性
        run: AGENTS_HOME="$GITHUB_WORKSPACE" bash tests/protect-files-reachability.sh

      # guard 是承載安全判定的 shell；-S error 只抓確定性 bug 不抓風格。
      # skills/auditing-skill-folder/scripts/*.sh 不在此列——上面那條測試是它的守護。
      - name: shellcheck（hooks / tests / bin）
        run: shellcheck -S error hooks/*.sh tests/*.sh bin/agents-sync bin/pr-review-gate bin/hook-parity-check bin/ci-local

      # 2026-07-26 版本時效稽核（約 4.6M subagent token）修掉 30 個 skill 的死寫法：
      # 教已移除的 API、不存在的 image tag、已 EOL 的 runtime。初始 28 條把那批缺陷的
      # 複發成本降到零，其後持續增補。
      #
      # 掃描範圍 2026-08-02 由 skills/ 擴為 skills/ bin/ hooks/ .github/（稽核
      # Follow-up 1）。原本這裡寫「proposals/ 的稽核報告與 attic/ 的歸檔副本必然含有
      # 這些字串，實測 repo-wide 掃會誤觸 19 條」——逐目錄實測推翻了兩處：attic/ 是
      # 0 條，repo-wide 實際 33 條而非 19。假陽性全來自 tests/（pattern 自身的字面值）
      # 與 proposals/（報告引用死寫法當反例），那兩個排除即可，其餘可安全納入。
      # 詳見 tests/version-tripwire.sh 檔頭設計決定 1。
      - name: 版本絆線（死寫法掃描）
        run: bash tests/version-tripwire.sh

      # 絆線自身的腐化守衛：對基準線 commit 斷言每條都仍會觸發。
      # 一條在基準線也 0 命中的絆線代表 pattern 已寫壞，它會安靜地永遠通過——
      # 那比沒有絆線更糟，因為它製造被保護的錯覺。（實測踩過一次：把 regex
      # 誤用 grep -F，[;,] 被當字面值而永遠 0 命中。）
      - name: 版本絆線自我驗證（每條須仍會觸發）
        run: bash tests/version-tripwire.sh --selftest

      # install-hooks.sh 自身可用性。CI **無法**斷言「hooks 已安裝」——那是每台開發機
      # 的屬性，runner 是全新 checkout 必然沒裝。但可以斷言**安裝器本身沒壞**：跑它，
      # 然後驗結果與版控來源逐位元組相同。
      # 這條會抓到的實際 bug（2026-07-25）：install-hooks.sh 曾用
      # `git rev-parse --show-toplevel` 解析路徑，那解析的是 **cwd** 的 repo，從別的
      # 目錄以絕對路徑呼叫會去操作錯的 repo。從 repo 外呼叫的情形一併覆蓋。
      - name: install-hooks.sh 可用且產物與來源一致
        run: |
          bash hooks/install-hooks.sh
          hp="$(git rev-parse --git-path hooks)"
          case "$hp" in /*) d="$hp" ;; *) d="$GITHUB_WORKSPACE/$hp" ;; esac
          rc=0
          for p in pre-commit-agents.sh:pre-commit post-checkout-agents.sh:post-checkout; do
            src="hooks/${p%%:*}"; dst="$d/${p##*:}"
            [ -x "$dst" ] || { echo "::error::${p##*:} 未安裝或不可執行"; rc=1; continue; }
            cmp -s "$src" "$dst" || { echo "::error file=$src::${p##*:} 安裝結果與來源不同"; rc=1; }
          done
          # 從 repo 外以絕對路徑呼叫也必須作用在本 repo（cwd bug 回歸）
          ( cd "$RUNNER_TEMP" && bash "$GITHUB_WORKSPACE/hooks/install-hooks.sh" >/dev/null ) \
            || { echo "::error::從 repo 外呼叫 install-hooks.sh 失敗"; rc=1; }
          cmp -s hooks/post-checkout-agents.sh "$d/post-checkout" \
            || { echo "::error::從 repo 外呼叫後產物不一致（cwd 解析 bug 回歸）"; rc=1; }
          exit $rc
